<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1f2328; --muted:#636c76; --line:#d8dee4; --card:#fff; --code:#f2f4f6;
          --accent:#2f6feb; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --card:#161b22; --code:#1e242c;
            --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.75 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; }
  .wrap { display:grid; grid-template-columns:240px minmax(0,1fr); gap:32px; max-width:1200px; margin:0 auto; padding:32px 24px 80px; }
  nav#toc { position:sticky; top:24px; align-self:start; font-size:14px; max-height:calc(100vh - 48px); overflow:auto; }
  nav#toc a { display:block; color:var(--muted); text-decoration:none; padding:3px 0 3px 10px; border-left:2px solid transparent; }
  nav#toc a.h3 { padding-left:22px; font-size:13px; }
  nav#toc a:hover, nav#toc a.active { color:var(--accent); border-left-color:var(--accent); }
  main { min-width:0; }
  h1 { font-size:1.9em; line-height:1.3; margin:0 0 .4em; }
  h2 { font-size:1.35em; margin:2.2em 0 .6em; padding-bottom:.3em; border-bottom:1px solid var(--line); }
  h3 { font-size:1.1em; margin:1.6em 0 .4em; }
  .meta { color:var(--muted); font-size:14px; }
  .tldr { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:14px 18px; margin:18px 0; }
  .callout { border-radius:8px; padding:12px 16px; margin:14px 0; border:1px solid var(--line); background:var(--card); }
  .callout.warn { border-left:4px solid var(--warn); } .callout.bad { border-left:4px solid var(--bad); } .callout.ok { border-left:4px solid var(--ok); }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; color:#fff; vertical-align:middle; }
  .badge.ok { background:var(--ok); } .badge.warn { background:var(--warn); } .badge.bad { background:var(--bad); }
  table { border-collapse:collapse; width:100%; margin:12px 0; font-size:14.5px; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
  th { background:var(--code); }
  code { background:var(--code); padding:.1em .35em; border-radius:4px; font-size:.9em; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  pre { background:var(--code); padding:12px 14px; border-radius:8px; overflow-x:auto; white-space:pre; font-size:13.5px; line-height:1.5; }
  pre code { background:none; padding:0; }
  ol.flow { counter-reset:step; list-style:none; padding-left:0; }
  ol.flow > li { counter-increment:step; position:relative; padding:10px 14px 10px 52px; margin:8px 0; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  ol.flow > li::before { content:counter(step); position:absolute; left:14px; top:10px; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .prompts { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .prompts > div { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 16px; }
  details { border:1px solid var(--line); border-radius:8px; padding:8px 14px; margin:10px 0; background:var(--card); }
  details > summary { cursor:pointer; font-weight:600; }
  @media (max-width:860px) { .wrap { grid-template-columns:1fr; } nav#toc { position:static; max-height:none; border-bottom:1px solid var(--line); padding-bottom:12px; } .prompts { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
<nav id="toc"></nav>
<main>
<!-- CONTENT: replace this comment with the explanation (h1, .meta, .tldr, then h2 sections) -->
</main>
</div>
<script>
  // Build the table of contents from h2/h3 and highlight the section in view.
  const toc = document.getElementById('toc'), heads = [...document.querySelectorAll('main h2, main h3')];
  heads.forEach((h, i) => { if (!h.id) h.id = 's' + i;
    const a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.textContent; a.className = h.tagName.toLowerCase(); toc.appendChild(a); });
  const links = [...toc.querySelectorAll('a')];
  const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(l => l.classList.toggle('active', l.hash === '#' + e.target.id)); }),
    { rootMargin: '0px 0px -70% 0px' });
  heads.forEach(h => obs.observe(h));
</script>
</body>
</html>
